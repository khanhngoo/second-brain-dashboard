[project]
name = "secondbrain"
version = "0.1.0"
description = "Local single-user second brain — data layer + MCP/HTTP/CLI front doors"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
calendar = [
    "google-api-python-client>=2",
    "google-auth>=2",
    "google-auth-oauthlib>=1",
    "keyring>=24",
]

[project.scripts]
sb = "secondbrain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secondbrain"]
